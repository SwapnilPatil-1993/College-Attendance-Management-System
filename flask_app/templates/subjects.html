{% extends 'base.html' %}{% block content %}<h1 class="h2">Subjects</h1><form method="post" class="card card-body my-3"><div class="row g-2"><div class="col-md"><input class="form-control" name="subject_name" placeholder="Subject name" required></div><div class="col-md"><select class="form-select" name="dept_id"><option value="">Choose department</option>{% for d in departments %}<option value="{{d.dept_id}}">{{d.dept_name}}</option>{% endfor %}</select></div><div class="col-md"><input class="form-control" name="new_department" placeholder="Or new department"></div><div class="col-md"><select class="form-select" name="year">{% for y in range(1,5) %}<option>{{y}}</option>{% endfor %}</select></div><div class="col-auto"><button class="btn btn-primary">Add</button></div></div></form><div class="table-responsive"><table class="table table-striped bg-white"><thead><tr><th>Subject</th><th>Department</th><th>Year</th><th></th></tr></thead><tbody>{% for s in subjects %}<tr><td>{{s.subject_name}}</td><td>{{s.dept_name}}</td><td>{{s.year}}</td><td class="d-flex gap-1"><a class="btn btn-sm btn-outline-primary" href="{{url_for('edit_subject',subject_id=s.subject_id)}}">Edit</a><form method="post" action="{{url_for('delete_subject',subject_id=s.subject_id)}}" onsubmit="return confirm('Delete this subject and its attendance?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="4">No subjects yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
