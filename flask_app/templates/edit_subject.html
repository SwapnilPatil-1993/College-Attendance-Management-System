{% extends 'base.html' %}{% block content %}<h1 class="h2">Edit subject</h1><form method="post" class="card card-body"><label class="form-label">Subject name</label><input class="form-control mb-3" name="subject_name" value="{{subject.subject_name}}" required><label class="form-label">Department</label><select class="form-select mb-3" name="dept_id">{% for d in departments %}<option value="{{d.dept_id}}" {% if d.dept_id==subject.dept_id %}selected{% endif %}>{{d.dept_name}}</option>{% endfor %}</select><label class="form-label">Year</label><select class="form-select mb-3" name="year">{% for y in range(1,5) %}<option value="{{y}}" {% if y==subject.year %}selected{% endif %}>{{y}}</option>{% endfor %}</select><div><button class="btn btn-primary">Save changes</button> <a class="btn btn-outline-secondary" href="{{url_for('subjects')}}">Cancel</a></div></form>{% endblock %}
