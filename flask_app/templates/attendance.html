{% extends 'base.html' %}{% block content %}<h1 class="h2">Mark attendance</h1><form method="get" class="row g-2 my-3"><div class="col-md-5"><select class="form-select" name="subject_id" required><option value="">Choose subject</option>{% for s in subjects %}<option value="{{s.subject_id}}" {% if subject_id==s.subject_id %}selected{% endif %}>{{s.subject_name}}</option>{% endfor %}</select></div><div class="col-md-4"><input class="form-control" type="date" name="att_date" value="{{att_date}}" max="{{today}}"></div><div class="col-auto"><button class="btn btn-outline-primary">Load</button></div></form>{% if subject_id %}<form method="post"><input type="hidden" name="subject_id" value="{{subject_id}}"><input type="hidden" name="att_date" value="{{att_date}}"><div class="table-responsive"><table class="table bg-white"><thead><tr><th>Roll no.</th><th>Student</th><th>Present</th></tr></thead><tbody>{% for s in students %}<tr><td>{{s.roll_no}}</td><td>{{s.name}}</td><td><input class="form-check-input" type="checkbox" name="present" value="{{s.student_id}}" {% if s.status=='Present' or s.status is none %}checked{% endif %}></td></tr>{% else %}<tr><td colspan="3">Add students before taking attendance.</td></tr>{% endfor %}</tbody></table></div><button class="btn btn-primary">Save attendance</button></form>{% endif %}{% endblock %}
