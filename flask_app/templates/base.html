<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}College Attendance{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="{{ url_for('dashboard') }}">Attendance System</a>
{% if session.get('admin') %}<div class="navbar-nav"><a class="nav-link" href="{{ url_for('students') }}">Students</a><a class="nav-link" href="{{ url_for('subjects') }}">Subjects</a><a class="nav-link" href="{{ url_for('mark_attendance') }}">Mark attendance</a><a class="nav-link" href="{{ url_for('reports') }}">Reports</a><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></div>{% endif %}</div></nav>
<main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</body></html>
