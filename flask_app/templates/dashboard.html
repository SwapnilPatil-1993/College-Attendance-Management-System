{% extends 'base.html' %}{% block content %}<h1 class="h2 mb-4">Dashboard</h1><div class="row g-3">{% for label,value in counts.items() %}<div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="text-secondary text-capitalize">{{ label }}</div><div class="display-5">{{ value }}</div></div></div></div>{% endfor %}<div class="col-md-4"><div class="card border-danger"><div class="card-body"><div class="text-secondary">Students below 75%</div><div class="display-5 text-danger">{{ low }}</div></div></div></div></div><p class="mt-4">Use the navigation to maintain records, take attendance, and review reports.</p>{% endblock %}
