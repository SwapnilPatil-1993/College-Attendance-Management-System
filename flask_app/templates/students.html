{% extends 'base.html' %}{% block content %}<h1 class="h2">Students</h1><form method="post" class="card card-body my-3"><div class="row g-2"><div class="col-md"><input class="form-control" name="roll_no" placeholder="Roll number" required></div><div class="col-md"><input class="form-control" name="name" placeholder="Full name" required></div><div class="col-md"><input class="form-control" type="email" name="email" placeholder="Email" required></div><div class="col-md"><select class="form-select" name="dept_id"><option value="">Choose department</option>{% for d in departments %}<option value="{{d.dept_id}}">{{d.dept_name}}</option>{% endfor %}</select></div><div class="col-md"><input class="form-control" name="new_department" placeholder="Or new department"></div><div class="col-md"><select class="form-select" name="year">{% for y in range(1,5) %}<option>{{y}}</option>{% endfor %}</select></div><div class="col-auto"><button class="btn btn-primary">Add</button></div></div></form><div class="table-responsive"><table class="table table-striped bg-white"><thead><tr><th>Roll no.</th><th>Name</th><th>Email</th><th>Department</th><th>Year</th><th></th></tr></thead><tbody>{% for s in students %}<tr><td>{{s.roll_no}}</td><td>{{s.name}}</td><td>{{s.email}}</td><td>{{s.dept_name}}</td><td>{{s.year}}</td><td class="d-flex gap-1"><a class="btn btn-sm btn-outline-primary" href="{{url_for('edit_student',student_id=s.student_id)}}">Edit</a><form method="post" action="{{url_for('delete_student',student_id=s.student_id)}}" onsubmit="return confirm('Delete this student and their attendance?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="6">No students yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
