{% extends 'base.html' %}{% block content %}<h1 class="h2">Edit student</h1><form method="post" class="card card-body"><label class="form-label">Roll number</label><input class="form-control mb-3" name="roll_no" value="{{student.roll_no}}" required><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{student.name}}" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" value="{{student.email}}" required><label class="form-label">Department</label><select class="form-select mb-3" name="dept_id">{% for d in departments %}<option value="{{d.dept_id}}" {% if d.dept_id==student.dept_id %}selected{% endif %}>{{d.dept_name}}</option>{% endfor %}</select><label class="form-label">Year</label><select class="form-select mb-3" name="year">{% for y in range(1,5) %}<option value="{{y}}" {% if y==student.year %}selected{% endif %}>{{y}}</option>{% endfor %}</select><div><button class="btn btn-primary">Save changes</button> <a class="btn btn-outline-secondary" href="{{url_for('students')}}">Cancel</a></div></form>{% endblock %}
